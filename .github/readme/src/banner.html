<!doctype html>
<!-- README banner. Rendered to ../banner.png by render.sh at 1280x400, 2x.
     The field is the website's backdrop (apps/website/src/scene.ts) redrawn in 2D: a stem plot
     of PCM samples, brass for an untouched signal. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Barlow+Semi+Condensed:wght@500&display=block" rel="stylesheet" />
<style>
  :root {
    --slate-950: #0e171c;
    --slate-900: #121d23;
    --porcelain: #e8edea;
    --mist: #8fa3a8;
    --brass: #c9a45c;
  }
  html, body { margin: 0; background: transparent; }
  .card {
    position: relative;
    width: 1280px;
    height: 400px;
    border-radius: 18px;
    overflow: hidden;
    background: radial-gradient(120% 140% at 85% 30%, #17262e 0%, var(--slate-900) 55%, var(--slate-950) 100%);
    font-family: "Barlow", system-ui, sans-serif;
    color: var(--porcelain);
  }
  canvas { position: absolute; inset: 0; width: 1280px; height: 400px; }
  .brand {
    position: absolute;
    top: 40px;
    left: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.01em;
  }
  .brand svg { width: 34px; height: 34px; color: var(--brass); }
  h1 {
    position: absolute;
    left: 50px;
    bottom: 92px;
    margin: 0;
    font-weight: 300;
    font-size: 168px;
    line-height: 0.86;
    letter-spacing: -0.035em;
  }
  p {
    position: absolute;
    left: 58px;
    bottom: 42px;
    margin: 0;
    font-size: 23px;
    color: var(--mist);
  }
</style>
</head>
<body>
<div class="card">
  <canvas id="field" width="2560" height="800"></canvas>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round">
        <circle cx="12" cy="12" r="10.6" />
        <path d="M12.00 1.40A6.5 6.5 0 0 1 12.00 14.40M20.29 5.39A6.5 6.5 0 0 1 10.12 13.50M22.33 14.36A6.5 6.5 0 0 1 9.66 11.47M16.60 21.55A6.5 6.5 0 0 1 10.96 9.84M7.40 21.55A6.5 6.5 0 0 1 13.04 9.84M1.67 14.36A6.5 6.5 0 0 1 14.34 11.47M3.71 5.39A6.5 6.5 0 0 1 13.88 13.50" />
      </g>
    </svg>
    BitSpring
  </div>
  <h1>Bit for bit</h1>
  <p>A free, bit-perfect music player for Mac, Windows, Linux and Android</p>
</div>
<script>
  // Same signal as the site's vertex shader: three partials drifting against each other,
  // quantised to 7 levels per half-scale, quieter towards the ends so the field dissolves.
  const c = document.getElementById("field");
  const g = c.getContext("2d");
  g.scale(2, 2);
  const W = 1280, H = 400;
  const ROWS = 22, COLS = 110, t = 2.3, levels = 7;
  const smooth = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
  const signal = (x, z, gx) => {
    const s = 0.55 * Math.sin(x * 0.55 - t * 1.05 + z * 1.7)
            + 0.28 * Math.sin(x * 1.35 + t * 0.66 - z * 2.3)
            + 0.17 * Math.sin(x * 2.90 - t * 1.80 + z * 0.6);
    return s * smooth(0, 0.18, gx) * smooth(1, 0.82, gx);
  };
  const q = (s) => Math.floor(s * levels + 0.5) / levels;

  // Back rows first. Simple perspective: rows recede up and to the right, away from the text.
  for (let r = ROWS - 1; r >= 0; r--) {
    const zn = r / (ROWS - 1);              // 0 = front, 1 = back
    const depth = 1 / (1 + zn * 2.4);        // shrinks with distance
    const baseY = 270 - zn * 170;
    const x0 = 560 + zn * 200, x1 = 1320 + zn * 30;
    const amp = 120 * depth;
    const alpha = (0.16 + 0.55 * (1 - zn)) * (0.35 + 0.65 * Math.exp(-Math.pow((zn - 0.35) * 2.2, 2)));
    for (let i = 0; i < COLS; i++) {
      const gx = i / (COLS - 1);
      const x = x0 + (x1 - x0) * gx;
      const v = q(signal(gx * 14, zn * 2 - 1, gx)) * amp;
      if (Math.abs(v) < 0.5) continue;
      // Fade the stems that would sit behind the headline and the line under it.
      const tipY = baseY - v;
      const behindText = 1 - 0.9 * smooth(820, 600, x) * smooth(150, 230, Math.max(baseY, tipY));
      const a = alpha * behindText;
      g.strokeStyle = `rgba(201,164,92,${a * 0.7})`;
      g.lineWidth = 1.1 * depth + 0.2;
      g.beginPath();
      g.moveTo(x, baseY);
      g.lineTo(x, baseY - v);
      g.stroke();
      g.fillStyle = `rgba(232,${200 + 20 * (1 - zn)},150,${Math.min(1, a * 1.3)})`;
      g.beginPath();
      g.arc(x, baseY - v, 1.5 * depth + 0.4, 0, Math.PI * 2);
      g.fill();
    }
  }
</script>
</body>
</html>
