<!doctype html>
<!-- Link preview card. render.sh renders it twice: 1200x630 for the website
     (apps/website/public/og.png) and 1280x640 for GitHub's social preview (../social.png).
     Everything is sized in vw, so both come out with the same composition. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&family=Barlow+Semi+Condensed:wght@500&display=block" rel="stylesheet" />
<style>
  :root {
    --slate-950: #0e171c;
    --slate-900: #121d23;
    --porcelain: #e8edea;
    --mist: #8fa3a8;
    --brass: #c9a45c;
  }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(110% 120% at 70% 25%, #17262e 0%, var(--slate-900) 55%, var(--slate-950) 100%);
    font-family: "Barlow", system-ui, sans-serif;
    color: var(--porcelain);
  }
  canvas { position: absolute; inset: 0; width: 100vw; height: 100vh; }
  .brand {
    position: absolute;
    top: 4.2vw;
    left: 4.6vw;
    display: flex;
    align-items: center;
    gap: 1vw;
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-weight: 500;
    font-size: 2.3vw;
  }
  .brand svg { width: 2.9vw; height: 2.9vw; color: var(--brass); }
  .url {
    position: absolute;
    top: 4.5vw;
    right: 4.6vw;
    font-size: 1.75vw;
    color: var(--mist);
  }
  h1 {
    position: absolute;
    left: 4vw;
    bottom: 17.2vw;
    margin: 0;
    font-weight: 300;
    font-size: 15vw;
    line-height: 0.86;
    letter-spacing: -0.035em;
  }
  p {
    position: absolute;
    left: 4.6vw;
    bottom: 4.4vw;
    margin: 0;
    max-width: 58vw;
    font-size: 2.3vw;
    line-height: 1.38;
    color: var(--mist);
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="brand">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round">
      <circle cx="12" cy="12" r="10.6" />
      <path d="M12.00 1.40A6.5 6.5 0 0 1 12.00 14.40M20.29 5.39A6.5 6.5 0 0 1 10.12 13.50M22.33 14.36A6.5 6.5 0 0 1 9.66 11.47M16.60 21.55A6.5 6.5 0 0 1 10.96 9.84M7.40 21.55A6.5 6.5 0 0 1 13.04 9.84M1.67 14.36A6.5 6.5 0 0 1 14.34 11.47M3.71 5.39A6.5 6.5 0 0 1 13.88 13.50" />
    </g>
  </svg>
  BitSpring
</div>
<div class="url">bitspring.app</div>
<h1>Bit for bit</h1>
<p>A free music player for macOS, Windows, Linux and Android. Your DAC gets exactly what is in the file: no resampling, no system mixer, no surprises.</p>
<script>
  // The website's backdrop (apps/website/src/scene.ts) redrawn in 2D, as in banner.html.
  // Laid out on a 1200-unit-wide grid and scaled to whatever size the page is rendered at.
  const c = document.getElementById("field");
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d");
  const u = W / 1200;
  g.scale(dpr * u, dpr * u);
  const HU = H / u; // height in grid units

  const ROWS = 24, COLS = 120, t = 2.3, levels = 7;
  const smooth = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
  const signal = (x, z, gx) => {
    const s = 0.55 * Math.sin(x * 0.55 - t * 1.05 + z * 1.7)
            + 0.28 * Math.sin(x * 1.35 + t * 0.66 - z * 2.3)
            + 0.17 * Math.sin(x * 2.90 - t * 1.80 + z * 0.6);
    return s * smooth(0, 0.14, gx) * smooth(1, 0.86, gx);
  };
  const q = (s) => Math.floor(s * levels + 0.5) / levels;
  // Where the headline sits, so stems behind it can fade out.
  const textTop = HU - 360;

  for (let r = ROWS - 1; r >= 0; r--) {
    const zn = r / (ROWS - 1);
    const depth = 1 / (1 + zn * 2.4);
    const baseY = HU * 0.56 - zn * HU * 0.36;
    const x0 = -40 + zn * 300, x1 = 1240 + zn * 20;
    const amp = 130 * depth;
    const alpha = (0.16 + 0.55 * (1 - zn)) * (0.35 + 0.65 * Math.exp(-Math.pow((zn - 0.35) * 2.2, 2)));
    for (let i = 0; i < COLS; i++) {
      const gx = i / (COLS - 1);
      const x = x0 + (x1 - x0) * gx;
      const v = q(signal(gx * 15, zn * 2 - 1, gx)) * amp;
      if (Math.abs(v) < 0.5) continue;
      const lowY = Math.max(baseY, baseY - v);
      const behindText = 1 - 0.8 * smooth(760, 560, x) * smooth(textTop - 10, textTop + 60, lowY);
      const a = alpha * behindText;
      g.strokeStyle = `rgba(201,164,92,${a * 0.7})`;
      g.lineWidth = 1.1 * depth + 0.2;
      g.beginPath();
      g.moveTo(x, baseY);
      g.lineTo(x, baseY - v);
      g.stroke();
      g.fillStyle = `rgba(232,${200 + 20 * (1 - zn)},150,${Math.min(1, a * 1.3)})`;
      g.beginPath();
      g.arc(x, baseY - v, 1.5 * depth + 0.4, 0, Math.PI * 2);
      g.fill();
    }
  }
</script>
</body>
</html>
