# Keeps the website's release notes page (/releases/) in step with GitHub Releases: when a release
# is published or its notes are edited, rebuild apps/website/src/releases.json and commit it to
# main. The commit touches apps/website, so Vercel deploys the site.
name: Release notes page

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild releases.json
        run: node apps/website/scripts/releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        env:
          TAG: ${{ github.event.release.tag_name || 'all releases' }}
        run: |
          if git diff --quiet -- apps/website/src/releases.json; then
            echo "Release notes page is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/src/releases.json
          git commit -m "Website: release notes for $TAG"
          # Someone may have pushed to main meanwhile.
          git pull --rebase origin main
          git push origin HEAD:main
